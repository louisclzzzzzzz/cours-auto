[project]
name = "cours-auto"
version = "0.1.0"
description = "App locale de prise de notes de cours automatisée (enregistrement, transcription Voxtral, mise en forme Mistral, publication Drive/Notion)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "jinja2>=3.1.6",
    "mistralai>=2.10.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "recurring-ical-events>=3.8.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cours-auto = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
