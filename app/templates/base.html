<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cours auto{% endblock %} · Cours auto</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/marked.umd.js" defer></script>
  <script src="/static/vendor/katex/katex.min.js" defer></script>
  <script src="/static/markdown.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🎙️ Cours auto</a>
    <nav>
      {% for href, label, active in nav %}
        <a href="{{ href }}" class="{{ 'active' if active }}">{{ label }}</a>
      {% endfor %}
    </nav>
    <div class="worker" hx-get="/fragments/worker" hx-trigger="load, every 4s" hx-swap="innerHTML"></div>
  </header>
  <main class="container">
    {% if msg %}<div class="flash {{ level }}">{{ msg }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
