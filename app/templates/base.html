<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cours auto{% endblock %} · Cours auto</title>
  <link rel="stylesheet" href="{{ static('app.css') }}">
  <link rel="stylesheet" href="{{ static('vendor/katex/katex.min.css') }}">
  <script src="{{ static('vendor/htmx.min.js') }}" defer></script>
  <script src="{{ static('vendor/marked.umd.js') }}" defer></script>
  <script src="{{ static('vendor/katex/katex.min.js') }}" defer></script>
  <script src="{{ static('markdown.js') }}" defer></script>
  <script src="{{ static('app.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">{{ icons.mic|safe }}</span> Cours auto</a>
    <nav aria-label="Navigation principale">
      <p class="nav-title" aria-hidden="true">Espace de travail</p>
      {% for href, label, active in nav %}
        <a href="{{ href }}"{% if active %} class="active" aria-current="page"{% endif %}>{{ icons[href]|safe }}{{ label }}</a>
      {% endfor %}
    </nav>
    <div class="worker" hx-get="/fragments/worker" hx-trigger="load, every 4s" hx-swap="innerHTML"></div>
  </header>
  {% if msg %}
  <div class="toast {{ level }}" role="{{ 'alert' if level == 'err' else 'status' }}" data-toast>
    <span>{{ msg }}</span>
    <button type="button" class="toast-close" data-dismiss aria-label="Fermer le message">×</button>
  </div>
  {% endif %}
  <main id="main" class="container" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
