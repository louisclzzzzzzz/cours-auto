{% if current %}
  <span class="spinner"></span>
  {% if current.get('recording_id') %}<a href="/enregistrements/{{ current.recording_id }}">Traitement #{{ current.recording_id }}</a>{% else %}Traitement{% endif %}
  <span class="small">— {{ detail }}</span>
  {% if queued %}<span class="small"> (+{{ queued }} en attente)</span>{% endif %}
{% else %}
  <span class="small">Aucun traitement en cours</span>
{% endif %}
