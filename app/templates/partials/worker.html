{% if current %}
<a href="{{ '/enregistrements/%d' % rec.id if rec else '/enregistrements' }}" title="{{ detail }}">
  <span class="spinner" aria-hidden="true"></span>
  <span class="ellipsis">{% if rec %}{{ rec.subject_name }} · {{ rec.course_type }} {{ rec.session_number }} : {% endif %}{{ step }}{% if queued %} (+{{ queued }} en attente){% endif %}</span>
</a>
{% endif %}
